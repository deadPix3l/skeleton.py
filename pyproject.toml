[project]
name = "_skeleton.py" # Not a real project - just a TEMPLATE
version = "0.0.1" 
description = "useful snippets"
readme = "README.md"
license = "UNLICENSE"
authors = [{name = "Your Name Here", email="you@email.com"}]
requires-python = ">=3.12"
# This is not a real project,
# and it has no real dependencies
# therefore, these will be common libraries i want to keep track of
dependencies = []

[project.optional-dependencies]
web = [
  "fastapi",
  "starlette",
  "flask",
  "django",
  "CherryPy",
]

web-server = [
  "uvicorn",
  "gunicorn",
]

web-ui = [
  "fasthx", # UI (HTMX)
  "htmy",
  "minihtml",
  "dominate",
  "domonic",
  "reactpy",
]

validation = [
  "pydantic>2",
  "attrs",
  "cattrs",
  "marshmallow",
  "itsdangerous",
]

templating = [
  "jinja2",
  "mako",
]

sql = [
  "sqlalchemy",
  "sqlmodel",
  "alembic", # migrations
]

kafka = [
  "kafka-python",
  "confluent-kafka",
  "aiokafka",
  "quixstreams",
  "faststream",
]

data-science = [
  "numpy",
  "pandas",
  "scikit-learn",
  "polars",
]

parsing = [
  "parsy",
  "lark",
  "ply",
]

cli = [
  #"argparse", #stdlib, dont need to install
  "fire", 
  "click",
  "typer",
]

dev = [
  "black",
  "flake8",
  "ruff",      # code linter/formatter
  "wily",      # maintainability metrics
  "mypy",      # type checking
  "memray",    # memory profiler
  "scalene",   # CPU + memory + GPU profiler
  "bandit",    # static security analysis
  "vulture",   # dead code detection
]

testing = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "hypothesis", # property-based testing
  "crosshair-tool", # Z3 based prover
  "freezegun", # time mocking
  "faker",
  "factory-boy",
]

design-by-contract = [
  "deal",
  "icontract",
]

http = [
  "httpx",     # sync + async, modern requests replacement
  "aiohttp",
  "requests",
]

scraping = [
  "beautifulsoup4",
  "lxml",      # fast parser, also used standalone
  "scrapy",    # full crawl framework
  "playwright", # browser automation
  "selenium",
  "pyquery",   # jQuery-like selectors
  "mechanize", # stateful browsing
]

serialization = [
  "orjson",    # fast JSON
  "msgspec",   # fast JSON + msgpack + struct validation
  "msgpack",
]

config = [
  "python-dotenv",
  "pydantic-settings", # pairs with pydantic
  "dynaconf",
]

async = [
  "anyio",    # backend-agnostic async primitives
  "trio",
  "asyncer",  # anyio sugar
]

task-queue = [
  "arq",      # async, Redis-backed
  "celery",
  "dramatiq",
]

logging = [
  "loguru",
  "structlog",
  "opentelemetry-sdk",
]

resilience = [
  "tenacity", # retry logic
  "stamina",  # structured retries + jitter
  "limits",   # rate limiting
]

functional = [
  "toolz",    # currying, composition, etc.
  "returns",  # Result/Maybe monads
]

caching = [
  "redis",
  "diskcache",
  "cachetools",
  "aiocache",
]

datetime = [
  "whenever", # type-safe, modern
  "pendulum",
  "arrow",
]

schemas = [
  "protobuf",
  "betterproto", # modern protobuf codegen
  "avro-python3",
]

search = [
  "elasticsearch",
  "meilisearch",
  "whoosh",    # pure python, no server
]

docs = [
  "mkdocs",
  "mkdocs-material",
  "sphinx",
]

tui = [
  "rich",
  "textual",  # full TUI framework
]

image = [
  "pillow",
  "opencv-python",
  "wand",          # ImageMagick binding
]

ai = [
  "openai",
  "anthropic",
  "langchain",
  "torch",
  "transformers",
]

#[project.scripts]
#templatecli = "template.main:cli" # rename this

#[tool.setuptools]
#packages = ["fastapi-template"]  # rename to your package

[build-system]
requires = ["setuptools"] # Or your preferred build backend
build-backend = "setuptools.build_meta" # Or your preferred build backend
